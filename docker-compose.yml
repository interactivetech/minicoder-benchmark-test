services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - ${MODEL_ID:-ricdomolm/mini-coder-1.7b}
      - --served-model-name
      - ${MODEL_ID:-ricdomolm/mini-coder-1.7b}
      - --dtype
      - bfloat16
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --max-model-len
      - "40960"
      - --gpu-memory-utilization
      - "0.90"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  huggingface-cache:
